<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>地铁小测</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --tile:#EDEFF1;
  --plate:#FFFFFF;
  --ink:#16202B;
  --line:#C6156C;
  --rail:#9AA7B2;
  --muted:#5A6874;
  --body:#3C4A57;
  --right:#0F7B4F;
  --wrong:#B3261E;

  --sans:"Barlow","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --cond:"Barlow Condensed","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;

  --col:720px;
  --gut:24px;
}

*{box-sizing:border-box}

html{-webkit-text-size-adjust:100%}

body{
  margin:0;
  background:var(--tile);
  color:var(--ink);
  font:400 17px/1.5 var(--sans);
  display:flex;
  flex-direction:column;
  min-height:100vh;
}

.col{
  width:100%;
  max-width:var(--col);
  margin:0 auto;
  padding:0 var(--gut);
}

:focus-visible{
  outline:2px solid var(--line);
  outline-offset:2px;
}

/* ── 标识牌 ─────────────────────────────────────── */

.sign{
  border-bottom:2px solid var(--ink);
  background:var(--plate);
}

.sign-row{
  display:flex;
  align-items:center;
  gap:14px;
  padding:16px 0;
}

.badge{
  flex:none;
  width:38px;
  height:38px;
  border-radius:3px;
  background:var(--line);
  color:var(--plate);
  font:700 22px/38px var(--sans);
  text-align:center;
  transition:background-color .3s ease;
}

.sign-name{
  margin:0;
  flex:1;
  font-size:40px;
  font-weight:700;
  letter-spacing:-0.015em;
  line-height:1.05;
}

.sign-toggle{
  flex:none;
  border:2px solid var(--ink);
  border-radius:3px;
  background:transparent;
  color:var(--ink);
  font:600 14px/1 var(--sans);
  padding:9px 12px;
  cursor:pointer;
}

.sign-toggle:hover{background:var(--ink);color:var(--plate)}

/* ── 线路图 ─────────────────────────────────────── */

.map{
  border-bottom:2px solid var(--ink);
  padding:22px 0 22px;
}

.map-tag{
  margin:0 0 18px;
  font:600 15px/1 var(--cond);
  letter-spacing:.04em;
  color:var(--line);
  transition:color .3s ease;
}

.map-frame{display:flex;align-items:flex-start}

.map-inner{position:relative;flex:1}

.map-rail,
.map-done{
  position:absolute;
  top:8px;
  height:5px;
  left:calc(50% / var(--n));
}

.map-rail{
  right:calc(50% / var(--n));
  background:var(--rail);
}

.map-done{
  width:calc((100% - (100% / var(--n))) * var(--filled));
  background:var(--line);
  transition:width .42s cubic-bezier(.22,.7,.28,1),background-color .3s ease;
}

.map-stops{
  display:flex;
  margin:0;
  padding:0;
  list-style:none;
  position:relative;
}

.map-stop{flex:1;min-width:0;text-align:center}

.map-node{
  display:block;
  width:21px;
  height:21px;
  margin:0 auto;
  border-radius:50%;
  border:5px solid var(--rail);
  background:var(--tile);
  transform:scale(.62);
  transition:transform .2s ease,background-color .2s ease,border-color .2s ease;
}

.map-stop[aria-current="step"] .map-node{
  transform:scale(1);
  box-shadow:0 0 0 4px var(--tile),0 0 0 6px var(--ink);
}

.map-stop[aria-current="step"]:not([data-mark]) .map-node{border-color:var(--ink)}

.map-stop[data-mark="right"] .map-node{
  border-color:var(--line);
  background:var(--line);
  transform:scale(1);
}

.map-stop[data-mark="wrong"] .map-node{
  border-color:var(--line);
  background:var(--plate);
  transform:scale(1);
}

.map-label{
  display:block;
  margin-top:13px;
  font:600 14px/1.2 var(--cond);
  letter-spacing:.01em;
  color:var(--muted);
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.map-stop[data-mark] .map-label,
.map-stop[aria-current="step"] .map-label{color:var(--ink)}

.map-arrow{
  flex:none;
  margin:4px 0 0 8px;
  width:0;
  height:0;
  border-style:solid;
  border-width:7px 0 7px 11px;
  border-color:transparent transparent transparent var(--rail);
}

.map-arrow[data-end="true"]{border-left-color:var(--line)}

/* ── 站点 ───────────────────────────────────────── */

.stage{flex:1;padding:34px 0 40px}

.stop-code{
  display:flex;
  align-items:baseline;
  gap:10px;
  margin-bottom:14px;
}

.stop-code b{
  border:2px solid var(--line);
  border-radius:3px;
  color:var(--line);
  font:600 13px/1 var(--cond);
  letter-spacing:.06em;
  padding:5px 7px;
}

.stop-code span{
  font:600 13px/1 var(--cond);
  color:var(--muted);
  letter-spacing:.04em;
}

.ask{
  margin:0 0 26px;
  max-width:24em;
  font-size:28px;
  font-weight:600;
  line-height:1.45;
  letter-spacing:-0.01em;
}

.picks{display:flex;flex-direction:column;gap:10px;max-width:38em}

.pick{
  display:flex;
  align-items:stretch;
  border:2px solid var(--ink);
  border-radius:3px;
  background:var(--plate);
  color:var(--ink);
  font:400 17px/1.4 var(--sans);
  text-align:left;
  padding:0;
  cursor:pointer;
}

.pick:hover{background:#F7F8F9}

.pick[aria-disabled="true"]{cursor:default}
.pick[aria-disabled="true"]:hover{background:var(--plate)}

.pick-key{
  flex:none;
  width:40px;
  background:var(--ink);
  color:var(--plate);
  font:600 15px/1 var(--sans);
  display:flex;
  align-items:center;
  justify-content:center;
}

.pick-text{padding:13px 15px}

.pick[data-verdict="right"]{border-bottom:4px solid var(--right)}
.pick[data-verdict="right"] .pick-key{background:var(--right)}

.pick[data-verdict="wrong"]{border-bottom:4px solid var(--wrong)}
.pick[data-verdict="wrong"] .pick-key{background:var(--wrong)}

/* ── 判定与解释 ─────────────────────────────────── */

.note{max-width:38em}
.note:empty{display:none}

.note-rule{
  border:0;
  border-top:2px solid var(--ink);
  margin:26px 0 14px;
}

.note-call{margin:0 0 6px;font-size:17px;font-weight:700}

.note-call[data-verdict="right"]{color:var(--right)}
.note-call[data-verdict="wrong"]{color:var(--wrong)}

.note-why{margin:0;font-size:15px;line-height:1.6;color:var(--body)}

/* ── 换乘 ───────────────────────────────────────── */

.xfer-done{
  margin:0 0 4px;
  font-size:34px;
  font-weight:700;
  letter-spacing:-0.015em;
  line-height:1.15;
}

.xfer-done:focus{outline:none}

.xfer-sub{margin:0 0 30px;font-size:16px;color:var(--body)}

.xfer-rule{border:0;border-top:2px solid var(--ink);margin:0 0 20px;max-width:38em}

.xfer-miss{margin:0 0 26px;padding:0;list-style:none;max-width:38em}

.xfer-miss li{
  display:flex;
  gap:11px;
  align-items:baseline;
  padding:10px 0;
  border-top:1px solid var(--rail);
  font-size:15px;
  line-height:1.5;
}

.xfer-miss li:last-child{border-bottom:1px solid var(--rail)}

.xfer-miss b{
  flex:none;
  width:4em;
  font:600 14px/1.4 var(--cond);
  letter-spacing:.02em;
  color:var(--wrong);
}

.xfer-all{
  margin:0 0 26px;
  font-size:15px;
  font-weight:600;
  color:var(--right);
}

.xfer-next{
  display:flex;
  align-items:center;
  gap:13px;
  max-width:38em;
}

.xfer-to{
  margin:0;
  font-size:22px;
  font-weight:600;
  line-height:1.2;
}

.xfer-to small{
  display:block;
  margin-top:3px;
  font:600 13px/1 var(--cond);
  letter-spacing:.04em;
  color:var(--muted);
}

/* ── 终点：线网图 ───────────────────────────────── */

.end-count{
  margin:0 0 4px;
  font-size:40px;
  font-weight:700;
  letter-spacing:-0.015em;
  line-height:1.1;
}

.end-count:focus{outline:none}

.end-sub{margin:0 0 30px;font-size:17px;color:var(--body)}

.net{margin:0 0 30px;padding:0;list-style:none;max-width:38em}

.net-row{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px 0;
  border-top:1px solid var(--rail);
}

.net-row:last-child{border-bottom:1px solid var(--rail)}

.net-badge{
  flex:none;
  width:26px;
  height:26px;
  border-radius:3px;
  background:var(--line);
  color:var(--plate);
  font:700 15px/26px var(--sans);
  text-align:center;
}

.net-name{
  flex:none;
  width:3.4em;
  font-size:15px;
  font-weight:600;
}

.net-dots{
  flex:none;
  display:flex;
  gap:7px;
  position:relative;
}

.net-dots::before{
  content:"";
  position:absolute;
  top:50%;
  left:4px;
  right:4px;
  height:3px;
  margin-top:-1.5px;
  background:var(--rail);
}

.net-dot{
  position:relative;
  width:13px;
  height:13px;
  border-radius:50%;
  border:3px solid var(--rail);
  background:var(--tile);
}

.net-dot[data-mark="right"]{border-color:var(--line);background:var(--line)}
.net-dot[data-mark="wrong"]{border-color:var(--line);background:var(--plate)}

.net-score{
  flex:none;
  margin-left:auto;
  font:600 14px/1 var(--cond);
  letter-spacing:.04em;
  color:var(--muted);
}

/* ── 站点一览 ───────────────────────────────────── */

.list-head{
  margin:0 0 6px;
  font-size:28px;
  font-weight:600;
  letter-spacing:-0.01em;
}

.list-sub{margin:0 0 26px;font-size:15px;color:var(--body)}

.list{margin:0;padding:0;list-style:none;max-width:40em}

.list-line{margin:0 0 30px}

.list-line-head{
  display:flex;
  align-items:center;
  gap:11px;
  padding-bottom:12px;
  border-bottom:4px solid var(--line);
}

.list-line-name{margin:0;font-size:20px;font-weight:700}

.list-stop{padding:20px 0;border-bottom:1px solid var(--rail)}

.list-q{margin:0 0 12px;font-size:18px;font-weight:600;line-height:1.5}

.list-opts{margin:0;padding:0;list-style:none;font-size:15px;line-height:1.7}

.list-opts li{display:flex;gap:9px}

.list-opts b{flex:none;font-weight:600;color:var(--muted)}

.list-opts li[data-verdict="right"],
.list-opts li[data-verdict="right"] b{color:var(--right)}

.list-opts li[data-verdict="wrong"],
.list-opts li[data-verdict="wrong"] b{color:var(--wrong)}

.list-note{margin:12px 0 0;font-size:14px;color:var(--body);line-height:1.6}

/* ── 按钮 ───────────────────────────────────────── */

.solid{
  border:2px solid var(--ink);
  border-radius:3px;
  background:var(--ink);
  color:var(--plate);
  font:600 15px/1 var(--sans);
  padding:13px 18px;
  cursor:pointer;
}

.solid:hover{background:var(--line);border-color:var(--line)}

/* ── 站台边缘带 ─────────────────────────────────── */

.edge{
  background:var(--line);
  color:var(--plate);
  border-top:4px solid var(--ink);
  transition:background-color .3s ease;
}

.edge-row{
  display:flex;
  align-items:center;
  gap:16px;
  padding:14px 0;
}

.edge :focus-visible{outline-color:var(--ink)}

.hint{flex:1;min-width:0}

.hint-open{
  display:inline-flex;
  align-items:center;
  gap:6px;
  cursor:pointer;
  font:600 15px/1 var(--sans);
  list-style:none;
  padding:7px 0;
}

.hint-open::-webkit-details-marker{display:none}

.hint-open::after{
  content:"";
  width:0;
  height:0;
  border-style:solid;
  border-width:5px 4px 0;
  border-color:currentColor transparent transparent;
  transition:transform .18s ease;
}

.hint[open] .hint-open::after{transform:rotate(180deg)}

.hint-body{margin:2px 0 6px;max-width:34em;font-size:15px;line-height:1.6}

.next{
  flex:none;
  margin-left:auto;
  border:2px solid var(--plate);
  border-radius:3px;
  background:var(--plate);
  color:var(--ink);
  font:600 16px/1 var(--sans);
  padding:13px 20px;
  cursor:pointer;
}

.next:hover{background:var(--ink);border-color:var(--ink);color:var(--plate)}

.next[disabled]{
  background:rgba(0,0,0,.14);
  border-color:rgba(255,255,255,.5);
  color:var(--plate);
  cursor:not-allowed;
}

/* ── 列车进站 ───────────────────────────────────── */

@keyframes arrive{
  from{opacity:0;transform:translateX(26px)}
  to{opacity:1;transform:none}
}

.is-arriving{animation:arrive .34s cubic-bezier(.22,.7,.28,1) both}

@media (prefers-reduced-motion:reduce){
  .is-arriving{animation:none}
  .map-done,.map-node,.hint-open::after,.badge,.map-tag,.edge{transition:none}
}

/* ── 窄屏 ───────────────────────────────────────── */

@media (max-width:560px){
  :root{--gut:18px}
  body{font-size:16px}
  .sign-name{font-size:30px}
  .end-count{font-size:30px}
  .xfer-done{font-size:26px}
  .badge{width:32px;height:32px;font-size:19px;line-height:32px}
  .sign-toggle{padding:8px 10px;font-size:13px}
  .ask,.list-head{font-size:22px}
  .map-label{font-size:12px;margin-top:10px}
  .pick{font-size:16px}
  .pick-key{width:34px}
  .stage{padding:26px 0 32px}
  .edge-row{flex-wrap:wrap;gap:8px}
  .hint{flex:1 0 100%}
  .next{width:100%}
  .net-name{width:auto;flex:1}
  .net-dots{flex:none}
  .xfer-to{font-size:19px}
}
</style>
</head>
<body>

<header class="sign">
  <div class="col sign-row">
    <span class="badge" id="badge" aria-hidden="true">1</span>
    <h1 class="sign-name">地铁小测</h1>
    <button class="sign-toggle" id="toggle" type="button" aria-expanded="false" aria-controls="list">站点一览</button>
  </div>
</header>

<nav class="map" id="map" aria-label="线路图">
  <div class="col">
    <p class="map-tag" id="mapTag"></p>
    <div class="map-frame">
      <div class="map-inner" id="mapInner">
        <div class="map-rail"></div>
        <div class="map-done"></div>
        <ol class="map-stops" id="mapStops"></ol>
      </div>
      <span class="map-arrow" id="mapArrow" aria-hidden="true"></span>
    </div>
  </div>
</nav>

<main class="stage">
  <div class="col">
    <div id="car">
      <div id="quiz"></div>
      <div class="note" id="note" aria-live="polite"></div>
    </div>
    <section id="list" hidden></section>
  </div>
</main>

<footer class="edge" id="edge">
  <div class="col edge-row">
    <details class="hint" id="hint">
      <summary class="hint-open">看提示</summary>
      <p class="hint-body" id="hintBody"></p>
    </details>
    <button class="next" id="next" type="button">下一站</button>
  </div>
</footer>

        options: [

  },

          "两列车之间的安全距离",
          "扶梯踏板之间的缝"
        ],
        answer: 1,
        hint: "直的车厢停在弯的站台边上，会发生什么。",
        explain: "车厢是直的，站台是弯的，中间必然留出空隙。这句广播 1969 年开始用，因为人手喊不过来。"
      },
      {
        station: "间隔",
        q: "一条线路的最小发车间隔，主要被什么限制？",
        options: [
          "车辆的最高速度",
          "信号系统的闭塞分区，以及终点站的折返能力",
          "站台的长度",

        ],

      },
      {
        station: "渡线",
        q: "地铁在区间里设置「渡线」，主要是为了什么？",
        options: [
          "让列车在中途掉头折返",

        ],
        answer: 0,
        hint: "前面出故障了，后面的车怎么办。",
        explain: "渡线让列车不必开到终点就能换到另一条轨道折返。前方区间出问题时，靠它维持一半线路继续运营。"

      {
        station: "全自动",
        q: "全自动无人驾驶的线路，几乎都会装屏蔽门。为什么？",

          "自动列车的停车位置不够准",

        hint: "有人驾驶时，是谁在确认站台安全。",
        explain: "司机进站时会观察站台。没有司机，安全就得交给屏蔽门这样的物理屏障，而不是靠人盯着。"
      },
      {
        station: "计价",
        q: "有些城市进站出站都要刷卡，为什么不能只刷一次？",
        options: [
          "为了统计客流量",
          "为了防止逃票",
          "票价按里程算，不知道你在哪下车就算不出来",

        ],
        answer: 2,
        hint: "看一眼票价表是怎么列的。",
        explain: "单一票价的城市只需进站刷一次。按里程计价就必须知道起点和终点，所以出站也得刷。"
      }

const KEYS = ["A", "B", "C", "D", "E", "F"];
const TOTAL = LINES.reduce((n, l) => n + l.questions.length, 0);

let line = 0;
let stop = 0;
let phase = "ride";
let picked = LINES.map(l => new Array(l.questions.length).fill(null));

const root = document.documentElement;
const el = {
  badge: document.getElementById("badge"),
  car: document.getElementById("car"),
  quiz: document.getElementById("quiz"),
  note: document.getElementById("note"),
  list: document.getElementById("list"),
  toggle: document.getElementById("toggle"),
  map: document.getElementById("map"),
  mapTag: document.getElementById("mapTag"),
  mapInner: document.getElementById("mapInner"),
  mapStops: document.getElementById("mapStops"),
  mapArrow: document.getElementById("mapArrow"),
  edge: document.getElementById("edge"),
  hint: document.getElementById("hint"),
  hintBody: document.getElementById("hintBody"),
  next: document.getElementById("next")
};

const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
const code = (l, s) => (l + 1) + "-" + String(s + 1).padStart(2, "0");
const lineScore = l => picked[l].reduce((n, p, i) => n + (p === LINES[l].questions[i].answer ? 1 : 0), 0);
const total = () => picked.reduce((n, _, l) => n + lineScore(l), 0);
const lineName = l => (l + 1) + " 号线　" + LINES[l].name;

function make(tag, cls, text) {
  const node = document.createElement(tag);
  if (cls) node.className = cls;
  if (text !== undefined) node.textContent = text;
  return node;
}

/* ── 线路图：只画当前这条线 ─────────────────────── */

function drawMap() {
  const qs = LINES[line].questions;
  const done = phase !== "ride";

  el.mapTag.textContent = lineName(line);
  el.mapInner.style.setProperty("--n", qs.length);
  el.mapInner.style.setProperty("--filled", done ? 1 : stop / (qs.length - 1));
  el.mapArrow.dataset.end = String(done);

  el.mapStops.textContent = "";
  qs.forEach((item, i) => {
    const li = make("li", "map-stop");
    const pick = picked[line][i];
    if (pick !== null) li.dataset.mark = pick === item.answer ? "right" : "wrong";
    if (!done && i === stop) li.setAttribute("aria-current", "step");
    li.appendChild(make("span", "map-node"));
    li.appendChild(make("span", "map-label", item.station));
    el.mapStops.appendChild(li);
  });
}

/* ── 站点 ───────────────────────────────────────── */

function drawStation() {
  const qs = LINES[line].questions;
  const item = qs[stop];
  const pick = picked[line][stop];
  const answered = pick !== null;

  el.quiz.textContent = "";

  const meta = make("div", "stop-code");
  meta.appendChild(make("b", null, code(line, stop)));
  meta.appendChild(make("span", null, "本线 " + qs.length + " 站　全程 " + TOTAL + " 站"));
  el.quiz.appendChild(meta);

  const ask = make("h2", "ask", item.q);
  ask.id = "ask";
  el.quiz.appendChild(ask);

  const picks = make("div", "picks");
  picks.setAttribute("role", "group");
  picks.setAttribute("aria-labelledby", "ask");

  item.options.forEach((text, i) => {
    const btn = make("button", "pick");
    btn.type = "button";
    btn.appendChild(make("span", "pick-key", KEYS[i]));
    btn.appendChild(make("span", "pick-text", text));

    if (answered) {
      btn.setAttribute("aria-disabled", "true");
      if (i === item.answer) btn.dataset.verdict = "right";
      else if (i === pick) btn.dataset.verdict = "wrong";
    } else {
      btn.addEventListener("click", () => choose(i));
    }
    picks.appendChild(btn);
  });
  el.quiz.appendChild(picks);

  el.note.textContent = "";
  if (!answered) return;

  el.note.appendChild(make("hr", "note-rule"));
  const won = pick === item.answer;
  const call = make("p", "note-call", won ? "答对了" : "正确答案是 " + KEYS[item.answer]);
  call.dataset.verdict = won ? "right" : "wrong";
  el.note.appendChild(call);
  el.note.appendChild(make("p", "note-why", item.explain));
}

/* ── 换乘 ───────────────────────────────────────── */

function drawTransfer() {
  const qs = LINES[line].questions;
  const to = line + 1;

  el.quiz.textContent = "";
  el.note.textContent = "";

  const head = make("h2", "xfer-done", lineName(line) + "　走完");
  head.id = "result";
  head.tabIndex = -1;
  el.quiz.appendChild(head);

  el.quiz.appendChild(make("p", "xfer-sub", "这条线 " + qs.length + " 站，答对 " + lineScore(line) + " 站。"));

  const missed = qs.filter((item, i) => picked[line][i] !== item.answer);
  if (missed.length === 0) {
    el.quiz.appendChild(make("p", "xfer-all", "全线答对。"));
  } else {
    const ul = make("ul", "xfer-miss");
    qs.forEach((item, i) => {
      if (picked[line][i] === item.answer) return;
      const li = make("li");
      li.appendChild(make("b", null, item.station));
      li.appendChild(make("span", null, item.options[item.answer]));
      ul.appendChild(li);
    });
    el.quiz.appendChild(ul);
  }

  el.quiz.appendChild(make("hr", "xfer-rule"));

  const row = make("div", "xfer-next");
  const badge = make("span", "net-badge", String(to + 1));
  badge.style.setProperty("--line", LINES[to].color);
  row.appendChild(badge);

  const to_ = make("p", "xfer-to", LINES[to].name);
  to_.appendChild(make("small", null, "接下来 " + LINES[to].questions.length + " 站"));
  row.appendChild(to_);

  el.quiz.appendChild(row);
}

/* ── 终点：线网图 ───────────────────────────────── */

function drawEnd() {
  el.quiz.textContent = "";
  el.note.textContent = "";

  const count = make("h2", "end-count", "答对 " + total() + " 站");
  count.id = "result";
  count.tabIndex = -1;
  el.quiz.appendChild(count);

  el.quiz.appendChild(make("p", "end-sub", "四条线，全程 " + TOTAL + " 站，已到终点。"));

  const net = make("ul", "net");
  LINES.forEach((l, li) => {
    const row = make("li", "net-row");
    row.style.setProperty("--line", l.color);

    row.appendChild(make("span", "net-badge", String(li + 1)));
    row.appendChild(make("span", "net-name", l.name));

    const dots = make("span", "net-dots");
    l.questions.forEach((item, i) => {
      const dot = make("span", "net-dot");
      const pick = picked[li][i];
      if (pick !== null) dot.dataset.mark = pick === item.answer ? "right" : "wrong";
      dots.appendChild(dot);
    });
    row.appendChild(dots);

    row.appendChild(make("span", "net-score", lineScore(li) + "/" + l.questions.length));
    net.appendChild(row);
  });
  el.quiz.appendChild(net);

  const again = make("button", "solid", "重新乘坐");
  again.type = "button";
  again.addEventListener("click", () => {
    line = 0;
    stop = 0;
    phase = "ride";
    picked = LINES.map(l => new Array(l.questions.length).fill(null));
    render({ arriving: true });
    focusFirstPick();
  });
  el.quiz.appendChild(again);
}

/* ── 站台边缘带 ─────────────────────────────────── */

function drawEdge() {
  if (phase === "end") {
    el.edge.hidden = true;
    return;
  }
  el.edge.hidden = false;

  if (phase === "transfer") {
    el.hint.hidden = true;
    el.next.disabled = false;
    el.next.textContent = "换乘 " + (line + 2) + " 号线";
    return;
  }

  const item = LINES[line].questions[stop];
  el.hintBody.textContent = item.hint;
  el.hint.open = false;
  el.hint.hidden = picked[line][stop] !== null;

  el.next.disabled = picked[line][stop] === null;
  el.next.textContent = stop === LINES[line].questions.length - 1
    ? (line === LINES.length - 1 ? "到终点" : "本线走完")
    : "下一站";
}

/* ── 渲染 ───────────────────────────────────────── */

function render(opts) {
  root.style.setProperty("--line", LINES[line].color);
  el.badge.textContent = String(line + 1);

  if (phase === "end") drawEnd();
  else if (phase === "transfer") drawTransfer();
  else drawStation();

  el.map.hidden = phase === "end";
  if (phase !== "end") drawMap();
  drawEdge();

  if (opts && opts.arriving && !calm()) {
    el.car.classList.remove("is-arriving");
    void el.car.offsetWidth;
    el.car.classList.add("is-arriving");
  }

  if (!el.list.hidden) drawList();
}

function focusFirstPick() {
  const first = el.quiz.querySelector(".pick");
  if (first) first.focus();
}

function focusResult() {
  const r = document.getElementById("result");
  if (r) r.focus();
}

function choose(i) {
  if (picked[line][stop] !== null) return;
  picked[line][stop] = i;
  render();
  el.next.focus();
}

function advance() {
  if (phase === "transfer") {
    line += 1;
    stop = 0;
    phase = "ride";
    render({ arriving: true });
    focusFirstPick();
    return;
  }

  if (picked[line][stop] === null) return;

  const last = stop === LINES[line].questions.length - 1;
  if (!last) {
    stop += 1;
    render({ arriving: true });
    focusFirstPick();
    return;
  }

  phase = line === LINES.length - 1 ? "end" : "transfer";
  render({ arriving: true });
  focusResult();
}

/* ── 站点一览 ───────────────────────────────────── */

function drawList() {
  el.list.textContent = "";
  el.list.appendChild(make("h2", "list-head", "站点一览"));
  el.list.appendChild(make("p", "list-sub", "四条线，全程 " + TOTAL + " 站。已答过的站会标出对错。"));

  LINES.forEach((l, li) => {
    const sec = make("section", "list-line");
    sec.style.setProperty("--line", l.color);

    const head = make("div", "list-line-head");
    head.appendChild(make("span", "net-badge", String(li + 1)));
    head.appendChild(make("h3", "list-line-name", l.name));
    sec.appendChild(head);

    const ol = make("ol", "list");
    l.questions.forEach((item, i) => {
      const row = make("li", "list-stop");
      row.appendChild(make("p", "list-q", code(li, i) + "　" + item.q));

      const pick = picked[li][i];
      const opts = make("ul", "list-opts");
      item.options.forEach((text, j) => {
        const o = make("li");
        o.appendChild(make("b", null, KEYS[j]));
        o.appendChild(make("span", null, text));
        if (pick !== null) {
          if (j === item.answer) o.dataset.verdict = "right";
          else if (j === pick) o.dataset.verdict = "wrong";
        }
        opts.appendChild(o);
      });
      row.appendChild(opts);

      if (pick !== null) row.appendChild(make("p", "list-note", item.explain));
      ol.appendChild(row);
    });
    sec.appendChild(ol);
    el.list.appendChild(sec);
  });
}

el.toggle.addEventListener("click", () => {
  const opening = el.list.hidden;
  el.list.hidden = !opening;
  el.car.hidden = opening;
  el.map.hidden = opening || phase === "end";
  el.edge.hidden = opening || phase === "end";
  el.toggle.setAttribute("aria-expanded", String(opening));
  el.toggle.textContent = opening ? "回到测验" : "站点一览";
  if (opening) drawList();
});

el.next.addEventListener("click", advance);

render();
</script>
